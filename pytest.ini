[pytest]
# ── Descubrimiento ────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Timeout por test (evita cuelgues de Qt en CI) ─────────────────────────────
# Cada test tiene máximo 30 segundos. Si Qt cuelga, el test falla en lugar
# de bloquear el runner completo.
timeout = 30
timeout_method = thread

# ── Markers personalizados ────────────────────────────────────────────────────
markers =
    qt: tests que instancian widgets Qt reales (requieren QApplication)
    unit: tests de lógica pura sin dependencias externas
    integration: tests de integración con base de datos

# ── Variables de entorno para CI ─────────────────────────────────────────────
# QT_QPA_PLATFORM=offscreen se establece en conftest.py antes de importar PySide6

# ── Salida ────────────────────────────────────────────────────────────────────
addopts =
    --tb=short
    -q
    --strict-markers

# ── Cobertura (cuando se pasa --cov) ─────────────────────────────────────────
# Excluir archivos que no aportan cobertura útil en CI
