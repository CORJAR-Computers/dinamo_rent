# ─────────────────────────────────────────────────────────────────────────────
# CI — Ruff + Pytest para Dinamo Rent ERP
# ─────────────────────────────────────────────────────────────────────────────
# Ejecuta en cada push/PR a main.
# Qt corre en modo offscreen (sin xvfb, sin display físico).
# ─────────────────────────────────────────────────────────────────────────────

name: CI — Ruff + Pytest

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DINAMO_DB_ENGINE: sqlite
  QT_QPA_PLATFORM: offscreen
  QT_LOGGING_RULES: "*.debug=false"

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.16,<1.0"

      - name: Run ruff check
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system Qt libs (offscreen — sin xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vi weasyprint requirements.txt | pip install -r /dev/stdin
          pip install \
            "pytest>=8,<9" \
            pytest-cov \
            pytest-timeout \
            pytest-qt

      - name: Copy config.ini.example
        run: cp config.ini.example config.ini

      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "*.debug=false"
          DINAMO_DB_ENGINE: sqlite
        run: |
          python -m pytest tests/ \
            --timeout=30 \
            --cov=. \
            --cov-report=term \
            --cov-report=xml \
            -v -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
