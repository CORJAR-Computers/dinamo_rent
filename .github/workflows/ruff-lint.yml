# ─────────────────────────────────────────────────────────────────────
# Ruff Lint — CI para calidad de código Python
# ─────────────────────────────────────────────────────────────────────
# Ejecuta ruff check en cada PR contra master/main.
# Bloquea el PR si hay errores de linting (E, F, W, C90).
# ─────────────────────────────────────────────────────────────────────

name: CI — Ruff + Pytest

on:
  pull_request:
    branches: [master, main]

env:
  DINAMO_DB_ENGINE: sqlite

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.9,<1.0"

      - name: Run ruff check
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies (Qt + xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libegl1 \
            libgl1 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8,<9"

      - name: Copy config.ini.example
        run: cp config.ini.example config.ini

      - name: Run tests
        run: xvfb-run python -m pytest tests/ -v --tb=short -q
